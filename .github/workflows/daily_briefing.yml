name: Daily Portfolio Briefing

on:
  schedule:
    # Runs at 03:00 UTC every Monday to Friday (approx 8:30 AM IST)
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub UI

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Portfolio Briefing Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_briefing.py