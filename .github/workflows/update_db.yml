name: Handle Telegram Update

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'The Telegram command text'
        required: true
        type: string

jobs:
  run-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install httpx sqlalchemy psycopg2-binary

      - name: Run update script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMAND_TEXT: ${{ github.event.inputs.command }}
        run: python update_db.py